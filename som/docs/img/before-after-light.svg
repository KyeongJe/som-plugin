<svg viewBox="0 0 940 360" width="940" height="360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="som: before and after"><rect width="940" height="360" fill="#f1f4f6"/><defs><marker id="ar" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#b6c4c9"/></marker><marker id="ar-acc" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#1c5cab"/></marker><marker id="ar-good" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#0e7a55"/></marker><marker id="ar-crit" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#c23a39"/></marker></defs><line x1="470" y1="30" x2="470" y2="330" stroke="#d7dfe1" stroke-dasharray="5 4"/><text x="24" y="44" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="15" font-weight="650" fill="#6b7f88">지금</text><text x="494" y="44" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="15" font-weight="650" fill="#1c5cab">som 을 쓰면</text><text x="40" y="84" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="13" fill="#6b7f88">·</text><text x="58" y="84" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="13" fill="#465a62">하나씩 순서대로 물어본다</text><path d="M430,79 L462,79" fill="none" stroke="#1c5cab" stroke-width="1.6" marker-end="url(#ar-acc)"/><text x="510" y="84" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f1b22">상관없는 일은 동시에 돈다</text><text x="40" y="132" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="13" fill="#6b7f88">·</text><text x="58" y="132" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="13" fill="#465a62">만드는 사람마다 양식이 다르다</text><path d="M430,127 L462,127" fill="none" stroke="#1c5cab" stroke-width="1.6" marker-end="url(#ar-acc)"/><text x="510" y="132" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f1b22">누가 만들어도 같은 양식</text><text x="40" y="180" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="13" fill="#6b7f88">·</text><text x="58" y="180" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="13" fill="#465a62">숫자가 맞는지는 눈으로 본다</text><path d="M430,175 L462,175" fill="none" stroke="#1c5cab" stroke-width="1.6" marker-end="url(#ar-acc)"/><text x="510" y="180" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f1b22">합계·명단·출처를 자동 대조</text><text x="40" y="228" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="13" fill="#6b7f88">·</text><text x="58" y="228" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="13" fill="#465a62">중간에 끊기면 처음부터</text><path d="M430,223 L462,223" fill="none" stroke="#1c5cab" stroke-width="1.6" marker-end="url(#ar-acc)"/><text x="510" y="228" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f1b22">세션이 죽어도 이어받는다</text><text x="40" y="276" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="13" fill="#6b7f88">·</text><text x="58" y="276" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="13" fill="#465a62">쓰던 사람만 안다</text><path d="M430,271 L462,271" fill="none" stroke="#1c5cab" stroke-width="1.6" marker-end="url(#ar-acc)"/><text x="510" y="276" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f1b22">같은 명령이면 같은 결과</text><text x="24" y="332" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="11" font-weight="400" fill="#6b7f88">실측: 작업 3개 