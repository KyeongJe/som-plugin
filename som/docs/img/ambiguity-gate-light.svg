<svg viewBox="0 0 940 400" width="940" height="400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="som: the 5% ambiguity gate"><rect width="940" height="400" fill="#f1f4f6"/><defs><marker id="ar" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#b6c4c9"/></marker><marker id="ar-acc" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#1c5cab"/></marker><marker id="ar-good" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#0e7a55"/></marker><marker id="ar-crit" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#c23a39"/></marker></defs><text x="24" y="40" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="17" font-weight="650" fill="#0f1b22">모호도 5% 미만일 때만 시작합니다</text><text x="24" y="62" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#465a62">라운드마다 숫자를 보여드립니다. 언제 시작되는지 짐작하지 않으셔도 됩니다.</text><rect x="24" y="96" width="892" height="30" rx="6" fill="#e8edef" fill-opacity="0.6" stroke="#d7dfe1"/><rect x="24" y="96" width="767.12" height="30" rx="6" fill="#a86f00" fill-opacity="0.16"/><rect x="791.12" y="96" width="124.88" height="30" rx="6" fill="#0e7a55" fill-opacity="0.18"/><line x1="791.12" y1="86" x2="791.12" y2="136" stroke="#c23a39" stroke-width="2"/><text x="785.12" y="80" text-anchor="end" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="11" font-weight="650" fill="#c23a39">문턱 5%</text><text x="36" y="116" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="11.5" font-weight="650" fill="#a86f00">100% ← 질문을 계속합니다</text><text x="904" y="116" text-anchor="end" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="11.5" font-weight="650" fill="#0e7a55">시작</text><line x1="24" y1="126" x2="24" y2="142" stroke="#465a62"/><text x="24" y="156" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" font-weight="650" fill="#465a62">R0</text><text x="24" y="170" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10" fill="#6b7f88">100%</text><text x="24" y="184" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10" fill="#465a62">구성 확인</text><line x1="323" y1="126" x2="323" y2="142" stroke="#465a62"/><text x="323" y="156" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" font-weight="650" fill="#465a62">R1</text><text x="323" y="170" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10" fill="#6b7f88">63%</text><line x1="533" y1="126" x2="533" y2="142" stroke="#465a62"/><text x="533" y="156" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" font-weight="650" fill="#465a62">R2</text><text x="533" y="170" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10" fill="#6b7f88">37%</text><line x1="735" y1="126" x2="735" y2="142" stroke="#465a62"/><text x="735" y="156" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" font-weight="650" fill="#465a62">R3</text><text x="735" y="170" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10" fill="#6b7f88">12%</text><line x1="847" y1="126" x2="847" y2="142" stroke="#0e7a55"/><text x="847" y="156" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" font-weight="650" fill="#0e7a55">R4</text><text x="847" y="170" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10" fill="#6b7f88">2%</text><text x="847" y="184" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10" fill="#0e7a55">통과</text><text x="24" y="216" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12" font-weight="650" fill="#0f1b22">숫자는 세 가지를 가중 평균한 값입니다 (기존 코드를 고치는 작업이면 네 가지)</text><rect x="24" y="228" width="214" height="44" rx="8" fill="#ffffff" stroke="#1c5cab" stroke-width="1.4"/><text x="131.0" y="246.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#0f1b22">목표</text><text x="131.0" y="262.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#6b7f88">가중 0.40 / 0.35</text><rect x="252" y="228" width="214" height="44" rx="8" fill="#ffffff" stroke="#1c5cab" stroke-width="1.4"/><text x="359.0" y="246.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#0f1b22">제약 · 경계</text><text x="359.0" y="262.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#6b7f88">가중 0.30 / 0.25</text><rect x="480" y="228" width="214" height="44" rx="8" fill="#ffffff" stroke="#1c5cab" stroke-width="1.4"/><text x="587.0" y="246.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#0f1b22">완료 기준</text><text x="587.0" y="262.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#6b7f88">가중 0.30 / 0.25</text><rect x="708" y="228" width="214" height="44" rx="8" fill="#ffffff" stroke="#d7dfe1" stroke-width="1.4"/><text x="815.0" y="246.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#6b7f88">기존 시스템</text><text x="815.0" y="262.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#6b7f88">가중 — / 0.15 · 수정 작업만</text><text x="24" y="286" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10" font-weight="400" fill="#6b7f88">신규 작업 / 기존 수정. 각각 합이 1.00 입니다.</text><rect x="24" y="292" width="440" height="102" rx="10" fill="#0e7a55" fill-opacity="0.10" stroke="#0e7a55"/><text x="40" y="314" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12" font-weight="650" fill="#0e7a55">숫자를 내리는 방법 두 가지</text><text x="40" y="334" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="11" font-weight="400" fill="#465a62">1. 질문에 답한다</text><text x="40" y="352" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="11" font-weight="400" fill="#465a62">2. 정말 모르는 항목을 '미확정' 으로 확정한다</text><text x="40" y="368" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#6b7f88">둘 다 정직한 답입니다. 2번은 사람이 확정해야</text><text x="40" y="382" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#6b7f88">적용됩니다 — 글로 "미확정" 이라고만 쓰면 안 됩니다.</text><rect x="476" y="292" width="440" height="102" rx="10" fill="#c23a39" fill-opacity="0.08" stroke="#c23a39"/><text x="492" y="314" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12" font-weight="650" fill="#c23a39">안 되는 방법</text><text x="492" y="334" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="11" font-weight="400" fill="#465a62">문턱을 올린다 — 설정으로도 안 됩니다</text><text x="492" y="352" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="11" font-weight="400" fill="#465a62">모른다고 적으면서 점수를 올린다 — 코드가 자릅니다</text><text x="492" y="370" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#6b7f88">"그냥 시작해" — 거부하고 2번을 권합니다</text></svg>
