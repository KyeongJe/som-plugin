Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#7d8f98">prd  ·  PRD</text><rect x="276" y="110" width="172" height="24" rx="5" fill="#171d21" stroke="#30393f" stroke-width="1.4"/><text x="362.0" y="126.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#7d8f98">watch  ·  밤샘 확인</text><rect x="276" y="139" width="172" height="24" rx="5" fill="#171d21" stroke="#30393f" stroke-width="1.4"/><text x="362.0" y="155.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#7d8f98">analyze  ·  엑셀 분석</text><rect x="276" y="168" width="172" height="24" rx="5" fill="#171d21" stroke="#30393f" stroke-width="1.4"/><text x="362.0" y="184.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#7d8f98">build  ·  개발</text><rect x="276" y="197" width="172" height="24" rx="5" fill="#171d21" stroke="#30393f" stroke-width="1.4"/><text x="362.0" y="213.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#7d8f98">data  ·  SF 분석</text><rect x="500" y="44" width="170" height="62" rx="8" fill="#171d21" stroke="#4a565d" stroke-width="1.4"/><text x="585.0" y="71.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#e6edf3">DAG</text><text x="585.0" y="87.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#7d8f98">작업 쪼개기 + 의존성</text><rect x="500" y="128" width="416" height="172" rx="12" fill="#21292e" fill-opacity="0.55" stroke="#30393f" stroke-dasharray="5 4"/><text x="512" y="145" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" font-weight="650" fill="#7d8f98" letter-spacing="0.04em">WAVE 실행</text><rect x="516" y="156" width="184" height="50" rx="6" fill="#171d21" stroke="#3fb98a" stroke-width="1.4"/><text x="608.0" y="177.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#e6edf3">워커 1</text><text x="608.0" y="193.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#7d8f98">opus / high</text><rect x="716" y="156" width="184" height="50" rx="6" fill="#171d21" stroke="#3fb98a" stroke-width="1.4"/><text x="808.0" y="177.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#e6edf3">워커 2</text><text x="808.0" y="193.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#7d8f98">sonnet / med</text><rect x="516" y="224" width="384" height="50" rx="6" fill="#171d21" stroke="#4a565d" stroke-width="1.4" stroke-dasharray="4 3"/><text x="708.0" y="245.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#e6edf3">다음 wave</text><text x="708.0" y="261.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#7d8f98">앞 작업이 끝나야 시작하는 것 + 파일이 겹치는 것</text><path d="M224,75 L258,90" fill="none" stroke="#6ea8fe" stroke-width="1.6" marker-end="url(#ar-acc)"/><path d="M462,75 L496,75" fill="none" stroke="#6ea8fe" stroke-width="1.6" marker-end="url(#ar-acc)"/><path d="M608,106 L608,152" fill="none" stroke="#3fb98a" stroke-width="1.6" marker-end="url(#ar-good)"/><path d="M640,106 L640,118 L808,118 L808,152" fill="none" stroke="#3fb98a" stroke-width="1.6" marker-end="url(#ar-good)"/><path d="M708,206 L708,220" fill="none" stroke="#4a565d" stroke-width="1.6" marker-end="url(#ar)"/><rect x="24" y="216" width="200" height="62" rx="8" fill="#171d21" stroke="#3fb98a" stroke-width="1.4"/><text x="124.0" y="243.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#3fb98a">결과</text><text x="124.0" y="259.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#7d8f98">파일 + 워커별 요약</text><path d="M500,300 L124,300 L124,282" fill="none" stroke="#3fb98a" stroke-width="1.6" marker-end="url(#ar-good)"/><text x="300" y="294" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#9fb0b8">정산 · 보고</text><text x="24" y="330" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="11" font-weight="650" fill="#9fb0b8">레시피는 JSON 파일 하나다. 새로운 종류의 일이 생기면 레시피만 추가하고 엔진은 건드리지 않는다.</text><text x="24" y="352" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#7d8f98">파일이 겹치는 두 작업은 같은 wave 에 넣지 않는다 — 워크트리로 격리하는 대신 순서로 푼다.</text><text x="24" y="372" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#7d8f98">느린 것과 실패한 것은 다르다. 15~60분 조용해도 죽이지 않는다.</text></svg>
