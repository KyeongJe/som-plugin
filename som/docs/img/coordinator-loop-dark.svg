<svg viewBox="0 0 900 440" width="900" height="440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="som coordinator loop"><rect width="900" height="440" fill="#0d1117"/><defs><marker id="ar" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#4a565d"/></marker><marker id="ar-acc" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#6ea8fe"/></marker><marker id="ar-good" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#3fb98a"/></marker><marker id="ar-crit" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#e26d6c"/></marker></defs><rect x="20" y="18" width="860" height="150" rx="12" fill="#21292e" fill-opacity="0.55" stroke="#30393f" stroke-dasharray="5 4"/><text x="32" y="35" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" font-weight="650" fill="#7d8f98" letter-spacing="0.04em">CLAUDE CODE 세션  ·  컨텍스트 압축 대상</text><rect x="60" y="52" width="200" height="88" rx="8" fill="#171d21" stroke="#6ea8fe" stroke-width="1.4"/><text x="160.0" y="92.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#6ea8fe">ROUTER</text><text x="160.0" y="108.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#7d8f98">som-supervisor + router.mjs</text><text x="70" y="128" font-family="IBM Plex Mono, Consolas, monospace" font-size="10" fill="#7d8f98">state.json · ack.json</text><rect x="330" y="52" width="190" height="88" rx="8" fill="#171d21" stroke="#4a565d" stroke-width="1.4"/><text x="425.0" y="92.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#e6edf3">판단 · 변경</text><text x="425.0" y="108.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#7d8f98">gate / reply / replan</text><rect x="590" y="52" width="250" height="88" rx="8" fill="#171d21" stroke="#e26d6c" stroke-width="1.4" stroke-dasharray="4 3"/><text x="715.0" y="100.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#e26d6c">check 를 절대 호출하지 않는다</text><rect x="20" y="232" width="860" height="150" rx="12" fill="#171d21" fill-opacity="0.55" stroke="#30393f" stroke-dasharray="5 4"/><text x="32" y="249" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" font-weight="650" fill="#7d8f98" letter-spacing="0.04em">MONITOR  ·  압축 면역</text><rect x="60" y="266" width="200" height="88" rx="8" fill="#171d21" stroke="#3fb98a" stroke-width="1.4"/><text x="160.0" y="306.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#3fb98a">WATCHER</text><text x="160.0" y="322.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#7d8f98">monitors/inbox-watch.mjs</text><text x="70" y="342" font-family="IBM Plex Mono, Consolas, monospace" font-size="10" fill="#7d8f98">loop.json</text><rect x="330" y="266" width="190" height="88" rx="8" fill="#171d21" stroke="#3fb98a" stroke-width="1.4"/><text x="425.0" y="306.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#e6edf3">유일한 소비자</text><text x="425.0" y="322.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#7d8f98">orchestration check --wait</text><rect x="590" y="266" width="250" height="88" rx="8" fill="#171d21" stroke="#4a565d" stroke-width="1.4"/><text x="715.0" y="306.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#e6edf3">Orca 런타임</text><text x="715.0" y="322.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#7d8f98">Run · Task · Dispatch</text><path d="M160,266 L160,140" fill="none" stroke="#3fb98a" stroke-width="1.6" marker-end="url(#ar-good)"/><text x="64" y="210" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#9fb0b8">한 줄 = 이벤트 하나</text><path d="M238,140 L238,266" fill="none" stroke="#6ea8fe" stroke-width="1.6" marker-end="url(#ar-acc)"/><text x="246" y="186" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#9fb0b8">ack 요청 (파일)</text><path d="M520,310 L590,310" fill="none" stroke="#3fb98a" stroke-width="1.6" marker-end="url(#ar-good)"/><path d="M590,330 L520,330" fill="none" stroke="#4a565d" stroke-width="1.6" marker-end="url(#ar)"/><text x="555" y="370" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#9fb0b8">delivery (≤50, FIFO)</text><path d="M715,266 L715,140" fill="none" stroke="#6ea8fe" stroke-width="1.6" marker-end="url(#ar-acc)"/><text x="723" y="205" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#9fb0b8">mutate</text><text x="20" y="406" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="11" font-weight="650" fill="#9fb0b8">router 가 배치 처리 중 죽으면 ack 가 안 되므로, 다음 세션의 watcher 가 같은 배치를 그대로 재발행한다.</text><text x="20" y="424" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#7d8f98">인바운드 이벤트용 별도 durability 가 필요 없는 이유가 이것입니다.</text></svg>
