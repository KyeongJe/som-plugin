<svg viewBox="0 0 940 342" width="940" height="342" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="som: what it will not do"><rect width="940" height="342" fill="#0d1117"/><defs><marker id="ar" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#4a565d"/></marker><marker id="ar-acc" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#6ea8fe"/></marker><marker id="ar-good" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#3fb98a"/></marker><marker id="ar-crit" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#e26d6c"/></marker></defs><text x="24" y="42" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="16" font-weight="650" fill="#e6edf3">믿고 맡겨도 되는 이유</text><text x="24" y="64" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#9fb0b8">익숙해지면 물어보는 횟수는 줄어듭니다. 아래 다섯 가지는 그래도 안 합니다.</text><circle cx="40" cy="92" r="9" fill="#e26d6c" fill-opacity="0.14" stroke="#e26d6c" stroke-width="1.2"/><path d="M36,88 L44,96 M44,88 L36,96" stroke="#e26d6c" stroke-width="1.6" stroke-linecap="round"/><text x="60" y="96" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="13" font-weight="650" fill="#e6edf3">강제 푸시 · 브랜치 삭제</text><text x="300" y="96" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12" fill="#9fb0b8">되돌릴 수 없는 git 조작은 사람이</text><circle cx="40" cy="130" r="9" fill="#e26d6c" fill-opacity="0.14" stroke="#e26d6c" stroke-width="1.2"/><path d="M36,126 L44,134 M44,126 L36,134" stroke="#e26d6c" stroke-width="1.6" stroke-linecap="round"/><text x="60" y="134" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="13" font-weight="650" fill="#e6edf3">어디에 올리거나 공유</text><text x="300" y="134" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12" fill="#9fb0b8">결과는 내 PC 파일로만. 공유는 사람이</text><circle cx="40" cy="168" r="9" fill="#e26d6c" fill-opacity="0.14" stroke="#e26d6c" stroke-width="1.2"/><path d="M36,164 L44,172 M44,164 L36,172" stroke="#e26d6c" stroke-width="1.6" stroke-linecap="round"/><text x="60" y="172" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="13" font-weight="650" fill="#e6edf3">자기가 자기를 승인</text><text x="300" y="172" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12" fill="#9fb0b8">확인이 필요한 건 사람에게 옵니다</text><circle cx="40" cy="206" r="9" fill="#e26d6c" fill-opacity="0.14" stroke="#e26d6c" stroke-width="1.2"/><path d="M36,202 L44,210 M44,202 L36,210" stroke="#e26d6c" stroke-width="1.6" stroke-linecap="round"/><text x="60" y="210" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="13" font-weight="650" fill="#e6edf3">내 설정 파일 건드리기</text><text x="300" y="210" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12" fill="#9fb0b8">Claude 설정은 손대지 않습니다</text><circle cx="40" cy="244" r="9" fill="#e26d6c" fill-opacity="0.14" stroke="#e26d6c" stroke-width="1.2"/><path d="M36,240 L44,248 M44,240 L36,248" stroke="#e26d6c" stroke-width="1.6" stroke-linecap="round"/><text x="60" y="248" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="13" font-weight="650" fill="#e6edf3">말없이 새 작업공간 만들기</text><text x="300" y="248" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12" fill="#9fb0b8">워크트리 생성은 언제나 확인</text><text x="24" y="292" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="11" font-weight="400" fill="#7d8f98">이건 설정이 아니라 구조입니다 — 켜고 끌 수 있는 옵션이 아닙니다.</text><text x="24" y="314" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="11" font-weight="400" fill="#7d8f98">Snowflake 쓰기는 이 목록에 없습니다. 대신 무엇을 바꾸는지 보여주고, 그 문장에만 붙는 승인을 사람이 넣어야 돕니다.</text></svg>
