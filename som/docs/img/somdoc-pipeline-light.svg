<svg viewBox="0 0 900 430" width="900" height="430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="somdoc pipeline"><rect width="900" height="430" fill="#f1f4f6"/><defs><marker id="ar" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#b6c4c9"/></marker><marker id="ar-acc" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#1c5cab"/></marker><marker id="ar-good" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#0e7a55"/></marker><marker id="ar-crit" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#c23a39"/></marker></defs><rect x="24" y="40" width="150" height="62" rx="8" fill="#ffffff" stroke="#b6c4c9" stroke-width="1.4"/><text x="99.0" y="67.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#0f1b22">skeleton</text><text x="99.0" y="83.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#6b7f88">rnr · kpi · charter</text><rect x="24" y="124" width="150" height="62" rx="8" fill="#ffffff" stroke="#b6c4c9" stroke-width="1.4"/><text x="99.0" y="151.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#0f1b22">원천 데이터</text><text x="99.0" y="167.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#6b7f88">xlsx · Snowflake</text><rect x="240" y="82" width="170" height="62" rx="8" fill="#ffffff" stroke="#1c5cab" stroke-width="1.4"/><text x="325.0" y="109.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#0f1b22">doc-drafter</text><text x="325.0" y="125.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#6b7f88">한국어 프로즈 작성</text><rect x="240" y="178" width="170" height="106" rx="12" fill="#e8edef" fill-opacity="0.55" stroke="#d7dfe1" stroke-dasharray="5 4"/><text x="252" y="195" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" font-weight="650" fill="#6b7f88" letter-spacing="0.04em">HUMANIZE</text><rect x="252" y="204" width="146" height="30" rx="6" fill="#ffffff" stroke="#b6c4c9" stroke-width="1.4"/><text x="325.0" y="223.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0f1b22">extract</text><rect x="252" y="242" width="146" height="30" rx="6" fill="#ffffff" stroke="#a86f00" stroke-width="1.4"/><text x="325.0" y="261.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0f1b22">apply + 불변식</text><rect x="470" y="82" width="170" height="62" rx="8" fill="#ffffff" stroke="#0e7a55" stroke-width="1.4"/><text x="555.0" y="109.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#0e7a55">IR (커밋 대상)</text><text x="555.0" y="125.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#6b7f88">*.somdoc.json</text><text x="480" y="162" font-family="IBM Plex Mono, Consolas, monospace" font-size="10" fill="#6b7f88">sha256 · sorted keys</text><line x1="672" y1="24" x2="672" y2="406" stroke="#1c5cab" stroke-width="1.4" stroke-dasharray="6 5"/><text x="678" y="38" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" font-weight="650" fill="#1c5cab">결정론 경계</text><text x="678" y="52" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10" font-weight="400" fill="#6b7f88">오른쪽은 LLM 없음</text><rect x="760" y="78" width="120" height="54" rx="6" fill="#ffffff" stroke="#0e7a55" stroke-width="1.4"/><text x="820.0" y="101.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#0f1b22">HTML</text><text x="820.0" y="117.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#6b7f88">열람 · 단일 파일</text><path d="M700,113 L756,105" fill="none" stroke="#b6c4c9" stroke-width="1.6" marker-end="url(#ar)"/><rect x="760" y="148" width="120" height="54" rx="6" fill="#ffffff" stroke="#1c5cab" stroke-width="1.4"/><text x="820.0" y="171.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#0f1b22">XLSX</text><text x="820.0" y="187.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#6b7f88">데이터 진실</text><path d="M700,113 L740,113 L740,175 L756,175" fill="none" stroke="#b6c4c9" stroke-width="1.6" marker-end="url(#ar)"/><rect x="760" y="218" width="120" height="54" rx="6" fill="#ffffff" stroke="#6b7f88" stroke-width="1.4"/><text x="820.0" y="241.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#0f1b22">DOCX</text><text x="820.0" y="257.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#6b7f88">회람 (Phase 2)</text><path d="M700,113 L740,113 L740,245 L756,245" fill="none" stroke="#b6c4c9" stroke-width="1.6" marker-end="url(#ar)"/><rect x="760" y="288" width="120" height="54" rx="6" fill="#ffffff" stroke="#6b7f88" stroke-width="1.4"/><text x="820.0" y="311.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#0f1b22">PPTX</text><text x="820.0" y="327.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#6b7f88">회의 12장 (Phase 4)</text><path d="M700,113 L740,113 L740,315 L756,315" fill="none" stroke="#b6c4c9" stroke-width="1.6" marker-end="url(#ar)"/><path d="M174,71 L232,100" fill="none" stroke="#b6c4c9" stroke-width="1.6" marker-end="url(#ar)"/><path d="M174,155 L232,124" fill="none" stroke="#b6c4c9" stroke-width="1.6" marker-end="url(#ar)"/><path d="M325,144 L325,198" fill="none" stroke="#a86f00" stroke-width="1.6" marker-end="url(#ar)"/><path d="M398,249 L440,249 L440,120 L466,113" fill="none" stroke="#a86f00" stroke-width="1.6" marker-end="url(#ar)"/><text x="452" y="190" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#465a62">윤문 적용</text><path d="M410,113 L466,113" fill="none" stroke="#1c5cab" stroke-width="1.6" marker-end="url(#ar-acc)"/><text x="24" y="330" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="11" font-weight="650" fill="#0f1b22">에이전트가 저작하는 것은 IR JSON 하나뿐이다.</text><text x="24" y="350" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#465a62">skeleton · theme · emitter 는 전부 플러그인 파일이라, 팀원이 커밋된 IR 로 재렌더하면 LLM 패스 없이 같은 바이트가 나온다.</text><text x="24" y="372" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#465a62">humanize 는 LLM 패스라 비결정적이므로 경계 왼쪽, IR 저작 단계에 있다.</text></svg>
