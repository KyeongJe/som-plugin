<svg viewBox="0 0 940 330" width="940" height="330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="som: it asks before it starts"><rect width="940" height="330" fill="#0d1117"/><defs><marker id="ar" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#4a565d"/></marker><marker id="ar-acc" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#6ea8fe"/></marker><marker id="ar-good" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#3fb98a"/></marker><marker id="ar-crit" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#e26d6c"/></marker></defs><text x="24" y="40" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="17" font-weight="650" fill="#e6edf3">모르는 건 지어내지 않고 물어봅니다</text><text x="24" y="62" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#9fb0b8">질문은 한 번에 모아서 옵니다. 하나씩 되묻지 않습니다.</text><rect x="24" y="92" width="176" height="58" rx="8" fill="#171d21" stroke="#6ea8fe" stroke-width="1.4"/><text x="112.0" y="117.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#e6edf3">"R&amp;R 문서 만들어줘"</text><text x="112.0" y="133.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#7d8f98">한 문장</text><path d="M204,121 L232,121" fill="none" stroke="#4a565d" stroke-width="1.6" marker-end="url(#ar)"/><rect x="236" y="86" width="330" height="152" rx="10" fill="#21292e" fill-opacity="0.5" stroke="#6ea8fe" stroke-dasharray="5 4"/><text x="252" y="106" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="11" font-weight="650" fill="#6ea8fe">한 화면에 모아서 질문</text><text x="252" y="130" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#e6edf3">어떤 문서인가요?</text><text x="392" y="130" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#7d8f98">R&amp;R · KPI · 차터</text><text x="252" y="157" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#e6edf3">명단은 어디 있나요?</text><text x="392" y="157" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#7d8f98">없으면 이름을 지어냅니다</text><text x="252" y="184" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#e6edf3">무엇을 승인받나요?</text><text x="392" y="184" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#7d8f98">문서 맨 앞에 들어갑니다</text><text x="252" y="211" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#e6edf3">누가 읽나요?</text><text x="392" y="211" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#7d8f98">요약 깊이가 달라집니다</text><path d="M570,140 L606,140" fill="none" stroke="#3fb98a" stroke-width="1.6" marker-end="url(#ar-good)"/><rect x="610" y="116" width="306" height="48" rx="8" fill="#171d21" stroke="#3fb98a" stroke-width="1.4"/><text x="763.0" y="144.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#3fb98a">답을 받으면 → 바로 시작</text><path d="M570,196 L606,196" fill="none" stroke="#e26d6c" stroke-width="1.6" marker-end="url(#ar-crit)"/><rect x="610" y="172" width="306" height="48" rx="8" fill="#171d21" stroke="#e26d6c" stroke-width="1.4"/><text x="763.0" y="200.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#e26d6c">답이 없으면 → 시작하지 않습니다</text><rect x="24" y="258" width="892" height="48" rx="10" fill="#e26d6c" fill-opacity="0.08" stroke="#e26d6c"/><text x="40" y="278" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12" font-weight="650" fill="#e26d6c">빈칸을 만난 AI 는 멈추지 않습니다 — 그럴듯한 것으로 채웁니다.</text><text x="40" y="296" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9fb0b8">R&amp;R 문서에 없는 사람 이름이 들어가는 건 문서가 없는 것보다 나쁩니다. 그래서 코드가 막습니다.</text></svg>
