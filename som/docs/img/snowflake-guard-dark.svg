" y="168" width="268" height="76" rx="8" fill="#171d21" stroke="#6ea8fe" stroke-width="1.4"/><text x="340.0" y="202.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#e6edf3">2차  토큰 regex</text><text x="340.0" y="218.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#7d8f98">불일치도 deny 로 기록</text><text x="340" y="264" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" font-weight="650" fill="#7d8f98">둘이 엇갈리면 그 자체를 기록</text><rect x="540" y="60" width="150" height="62" rx="8" fill="#171d21" stroke="#d9a03a" stroke-width="1.4"/><text x="615.0" y="87.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#e6edf3">cost guard</text><text x="615.0" y="103.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#7d8f98">EXPLAIN bytes · LIMIT</text><rect x="540" y="150" width="150" height="62" rx="8" fill="#171d21" stroke="#3fb98a" stroke-width="1.4"/><text x="615.0" y="177.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#3fb98a">SELECT 실행</text><text x="615.0" y="193.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#7d8f98">단일 커넥션 · SSO 1회</text><rect x="740" y="150" width="140" height="62" rx="8" fill="#171d21" stroke="#3fb98a" stroke-width="1.4"/><text x="810.0" y="177.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#e6edf3">parquet 캐시</text><text x="810.0" y="193.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#7d8f98">+ .meta.json<