x="349.0" y="130.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#6b7f88">trigger · action · 근거</text><path d="M448,118 L480,118" fill="none" stroke="#b6c4c9" stroke-width="1.6" marker-end="url(#ar)"/><rect x="484" y="82" width="200" height="72" rx="10" fill="#c23a39" fill-opacity="0.08" stroke="#c23a39" stroke-width="1.6"/><text x="584" y="108" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#c23a39">품질 게이트</text><text x="584" y="126" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#465a62">근거 확인 · 일반론 거부</text><text x="584" y="142" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#465a62">자격증명 거부 · 중복 병합</text><path d="M688,118 L720,118" fill="none" stroke="#0e7a55" stroke-width="1.6" marker-end="url(#ar-good)"/><rect x="724" y="90" width="192" height="56" rx="8" fill="#ffffff" stroke="#0e7a55" stroke-width="1.4"/><text x="820.0" y="114.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#0e7a55">패턴 라이브러리</text><text x="820.0" y="130.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#6b7f88">신뢰도 40 에서 시작</text><path d="M584,158 L584,196" fill="none" stroke="#c23a39" stroke-width="1.6" marker-end="url(#ar-crit)"/><rect x="410" y="200" width="348" height="34" rx="8" fill="#e8edef" fill-opacity="0.5" stroke="#d7dfe1" stroke-dasharray="4 3"/><text x="584" y="222" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="11" fill="#6b7f88">거부 — 후보 대부분은 여기로 옵니다</text><path d="M820,150 L820,264" fill="none" stroke="#0e7a55" stroke-width="1.6" marker-end="url(#ar-good)"/><rect x="724" y="268" width="192" height="56" rx="8" fill="#ffffff" stroke="#1c5cab" stroke-width="1.4"/><text x="820.0" y="292.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#0f1b22">다음 런의 브리핑</text><text x="820.0" y="308.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#6b7f88">최대 3개만 주입</text><path d="M724,296 L470,296" fill="none" stroke="#b6c4c9" stroke-width="1.6" marker-end="url(#ar)"/><rect x="254" y="268" width="212" height="56" rx="8" fill="#ffffff" stroke="#d7dfe1" stroke-width="1.4"/><text x="360.0" y="292.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#465a62">태스크별 결과로 채점</text><text x="360.0" y="308.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#6b7f88">성공 +8 · 실패 −20</text><path d="M254,296 L222,296" fill="none" stroke="#c23a39" stroke-width="1.6" marker-end="url(#ar-crit)"/><rect x="24" y="268" width="194" height="56" rx="8" fill="#ffffff" stroke="#c23a39" stroke-width="1.4"/><text x="121.0" y="292.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#c23a39">신뢰도 15 미만</text><text x="121.0" y="308.0" text-anchor="middle" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="10.5" fill="#6b7f88">내림 — 기록은 남김</text><rect x="24" y="344" width="892" height="62" rx="10" fill="#0e7a55" fill-opacity="0.10" stroke="#0e7a55"/><text x="40" y="366" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="12" font-weight="650" fill="#0e7a55">"쿼리는 작게 나누는 게 좋다" 는 저장하지 않습니다.</text><text x="40" y="388" text-anchor="start" font-family="IBM Plex Sans KR, Malgun Gothic, system-ui, sans-serif" font-size="11" font-weight="400" fill="#465a62">언제 그런지 · 무엇을 하라는 것인지 · 어디서 알게 됐는지가 없으면 격언이고, 격언 도서관은 빈 도서관보다 나쁩니다.</text></svg>
