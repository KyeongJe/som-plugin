name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned dependencies
        run: pip install -r som/engine/requirements.txt

      # Globbed, not listed.
      #
      # These steps used to name eight test files by hand, and the list went
      # stale the day test_write_path.py was added: 28 tests covering the
      # Snowflake write approval -- the most dangerous path in the plugin --
      # ran nowhere, and CI stayed green. The same defect had already hit
      # docs/make_images.py three times, which is why that file refuses to
      # draw when a test lands in no bucket.
      #
      # So: every test_*.py on disk runs. A suite that prints no "N/M passed"
      # line fails the job rather than passing silently, and a suite count
      # below what exists today fails too -- deleting a suite has to be a
      # deliberate edit here, not a quiet one.
      - name: Python tests — every engine/tests/test_*.py
        working-directory: som
        env:
          PYTHONUTF8: "1"
          PYTHONPATH: engine
        run: |
          set -eu
          found=0
          for f in engine/tests/test_*.py; do
            found=$((found + 1))
            echo "::group::$f"
            out=$(python "$f")
            echo "$out"
            echo "::endgroup::"
            line=$(echo "$out" | grep -E '^[0-9]+/[0-9]+ passed$' | tail -1 || true)
            if [ -z "$line" ]; then
              echo "::error::$f did not report 'N/M passed'"
              exit 1
            fi
            got=${line%%/*}
            rest=${line#*/}
            total=${rest%% *}
            if [ "$got" != "$total" ]; then
              echo "::error::$f is $line"
              exit 1
            fi
          done
          if [ "$found" -lt 9 ]; then
            echo "::error::only $found python suites ran; expected at least 9"
            exit 1
          fi
          echo "$found python suites, all green"

      # Everything on the Node side: the Snowflake bypass guards (which matter
      # in both directions -- deny outside the entrypoint, never block
      # unrelated work), the ambiguity gate, the pattern library, the autonomy
      # ledger. The live-worker e2e is not here; it needs Orca.
      # A parser, because a regex cannot do this.
      #
      # `const pf = this.preflight()` was moved inside an `if` block and the
      # two reads below it were left outside, so every parallel run died with
      # `ReferenceError: pf is not defined` while all 373 tests stayed green.
      # `Conduct.run()` has no unit test -- it needs Orca and paid workers --
      # so nothing executed the line.
      #
      # no-undef finds that class without running anything. Verified against a
      # copy of the original bug before this step was added: two errors, one
      # per use site. A check nobody has seen fail proves nothing.
      #
      # eslint is a CI tool, not a plugin dependency. Nothing shipped in som/
      # imports it and the plugin still installs with zero npm packages.
      - name: No undefined references
        run: npx --yes eslint@9 -c eslint.config.mjs som/lib som/bin som/scripts som/monitors som/test tools

      - name: Node engine
        working-directory: som
        run: node --test test/*.test.mjs

      # The golden test byte-compares HTML, so it only means anything if line
      # endings are normalised. .gitattributes pins `* text eol=lf`; this
      # proves the checkout honoured it.
      - name: Golden render is byte-identical
        working-directory: som
        env:
          PYTHONUTF8: "1"
          PYTHONPATH: engine
        run: |
          python -m somdoc golden standard/examples/rnr.example.somdoc.json \
            --against standard/examples/golden/rnr.html --as-of 2026-09-09

      - name: Documentation rebuilds
        working-directory: som
        env:
          PYTHONUTF8: "1"
        run: python docs/build_docs.py --out /tmp/somdocs

      # Every published test count, against what the suites actually report.
      # The README total, its per-suite breakdown, and the generated graph are
      # three separate pipelines, and all three have drifted.
      - name: Published counts are measured, not typed
        working-directory: som
        env:
          PYTHONUTF8: "1"
        run: python docs/check_counts.py
